version: '3.9'

networks:
  fabric_net:
    driver: overlay
    attachable: true
    name: fabric_fabric_net  # Явное именование для Swarm

services:
  ca_org1:
    image: hyperledger/fabric-ca:1.5.2
    hostname: ca.org1.example.com  # Добавляем FQDN
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org1
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_TLS_CERTFILE=/etc/hyperledger/tls/tlsca.org1.example.com-cert.pem
      - FABRIC_CA_SERVER_TLS_KEYFILE=/etc/hyperledger/tls/priv_sk
    ports:
      - "7054:7054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ./organizations/peerOrganizations/org1.example.com/ca:/etc/hyperledger/fabric-ca-server
      - ./organizations/peerOrganizations/org1.example.com/tlsca:/etc/hyperledger/tls
    networks:
      fabric_net:
        aliases:
          - ca.org1.example.com
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == debian]  # Фиксируем на debian

  orderer:
    image: hyperledger/fabric-orderer:2.4.4
    hostname: orderer.example.com  # Обязательно для TLS
    environment:
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/etc/hyperledger/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/etc/hyperledger/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/etc/hyperledger/tls/ca.crt]
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
    volumes:
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/etc/hyperledger/tls
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
    ports:
      - "7050:7050"
    networks:
      fabric_net:
        aliases:
          - orderer.example.com
    deploy:
      replicas: 1
      placement:
        constraints: [node.hostname == debian]  # Фиксируем на PC1

  peer0_org1:
    image: hyperledger/fabric-peer:2.4.4
    hostname: peer0.org1.example.com
    environment:
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052  # Используем FQDN
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051  # FQDN для gossip
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051  # FQDN для начального подключения
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/peer/msp
      - CORE_PEER_TLS_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/tls/ca.crt
    volumes:
      - ./organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com:/etc/hyperledger/peer
      - ./organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/etc/hyperledger/tls
    ports:
      - "7051:7051"
      - "7052:7052"  # Добавляем порт для chaincode
    networks:
      fabric_net:
        aliases:
          - peer0.org1.example.com
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.hostname == debian]  # Фиксируем на PC1