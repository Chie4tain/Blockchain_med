version: '3.8'

networks:
  fabric-net:
    driver: bridge

services:
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.4.4
    environment:
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]  # Явное указание корневого сертификата
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/genesis.block
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block  # Правильный путь
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
    ports:
      - "7050:7050"
    extra_hosts:
      - "orderer.example.com:172.22.120.79"
    networks:
      - fabric-net

  ca.org1.example.com:
    image: hyperledger/fabric-ca:1.5.2 
    environment:
      - FABRIC_CA_VERSION=1.5.2  # Явное указание версии
      - FABRIC_CA_SERVER_CA_NAME=ca.org1
      - FABRIC_CA_SERVER_TLS_ENABLED=false
    volumes:
      - ./organizations/peerOrganizations/org1.example.com/ca/:/etc/hyperledger/fabric-ca-server
    ports:
      - "7054:7054"
    command: fabric-ca-server start -b admin:adminpw --cfg.identities.allowremove
    networks:
      - fabric-net

  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.4.4
    environment:
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
    volumes:
      - ./organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/peer/msp
      - ./chaincode:/opt/gopath/src/chaincode
    ports:
      - "7051:7051"
    extra_hosts:
      - "orderer.example.com:172.22.120.79"
    networks:
      - fabric-net